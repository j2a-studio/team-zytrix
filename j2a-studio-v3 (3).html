<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>J2A Studio — Editor Database</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#07090f;--surface:#0d1117;--surface2:#111827;--surface3:#1f2937;
    --border:#1f2937;--border2:#374151;
    --indigo:#6366f1;--violet:#8b5cf6;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#60a5fa;--orange:#f97316;
    --text:#f9fafb;--text2:#d1d5db;--text3:#9ca3af;--text4:#6b7280;--text5:#4b5563;
  }
  body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
  input,select,textarea{outline:none;font-family:inherit}
  button{font-family:inherit;cursor:pointer}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:var(--surface)}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

  /* LOGIN */
  #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .login-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px;width:100%;max-width:400px;text-align:center}
  .login-logo{width:56px;height:56px;background:linear-gradient(135deg,var(--indigo),var(--violet));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;margin:0 auto 20px}
  .login-title{font-size:22px;font-weight:800;margin-bottom:4px}
  .login-sub{color:var(--text4);font-size:13px;margin-bottom:28px}
  .login-role-btns{display:flex;gap:8px;margin-bottom:24px}
  .login-role-btn{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text3);font-weight:600;font-size:13px;transition:.2s}
  .login-role-btn.active{background:#6366f122;border-color:var(--indigo);color:var(--indigo)}
  .pin-label{color:var(--text4);font-size:12px;font-weight:600;text-align:left;margin-bottom:6px}
  .pin-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:12px 16px;font-size:18px;color:var(--text);letter-spacing:8px;text-align:center;margin-bottom:8px}
  .pin-input:focus{border-color:var(--indigo);box-shadow:0 0 0 2px #6366f130}
  .editor-select{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:12px 16px;font-size:14px;color:var(--text);margin-bottom:16px}
  .login-btn{width:100%;background:linear-gradient(135deg,var(--indigo),var(--violet));border:none;color:#fff;padding:13px;border-radius:10px;font-size:15px;font-weight:700;transition:.2s}
  .login-btn:hover{opacity:.9;transform:translateY(-1px)}
  .login-err{color:var(--red);font-size:12px;margin-top:8px;min-height:18px}

  /* NAVBAR */
  #navbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:40}
  .nav-brand{display:flex;align-items:center;gap:10px}
  .nav-logo{width:30px;height:30px;background:linear-gradient(135deg,var(--indigo),var(--violet));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900}
  .nav-title{font-size:15px;font-weight:800}
  .nav-title span{color:var(--indigo)}
  .nav-right{display:flex;align-items:center;gap:10px}
  .nav-badge{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 12px;font-size:12px;color:var(--text3)}
  .nav-badge b{color:var(--indigo)}
  .logout-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text3);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600}
  .logout-btn:hover{border-color:var(--red);color:var(--red)}

  /* MAIN */
  #main{padding:24px;max-width:1200px;margin:0 auto}

  /* TOAST */
  #toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--green);border-radius:12px;padding:14px 20px;font-size:14px;font-weight:600;color:var(--green);z-index:200;opacity:0;transform:translateY(20px);transition:.3s;pointer-events:none}
  #toast.show{opacity:1;transform:translateY(0)}

  /* STATS */
  .stats-row{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;flex:1;min-width:130px}
  .stat-label{font-size:10px;color:var(--text4);font-weight:700;letter-spacing:.8px;margin-bottom:6px;text-transform:uppercase}
  .stat-value{font-size:24px;font-weight:800}
  .stat-sub{font-size:11px;color:var(--text5);margin-top:3px}

  /* SEARCH */
  .search-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
  .search-wrap{position:relative;flex:3;min-width:200px}
  .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text5);font-size:14px;pointer-events:none}
  .search-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 36px;font-size:13px;color:var(--text)}
  .search-input:focus{border-color:var(--indigo);box-shadow:0 0 0 2px #6366f120}
  .filter-btns{display:flex;gap:6px;flex-wrap:wrap}
  .filter-btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text4);font-size:12px;font-weight:600;transition:.15s}
  .filter-btn.active{background:#6366f122;border-color:var(--indigo);color:var(--indigo)}
  .add-btn{background:linear-gradient(135deg,var(--indigo),var(--violet));border:none;color:#fff;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;white-space:nowrap;transition:.2s}
  .add-btn:hover{opacity:.9}

  /* EDITOR GRID */
  .editor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .editor-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;cursor:pointer;transition:.2s}
  .editor-card:hover{border-color:#6366f155;transform:translateY(-2px);box-shadow:0 8px 30px #0005}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .card-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--violet));display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex-shrink:0}
  .card-name{font-weight:700;font-size:15px}
  .card-id{color:var(--violet);font-size:11px;font-weight:600}
  .card-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .card-stat{background:var(--surface2);border-radius:8px;padding:8px 10px}
  .cs-label{font-size:10px;color:var(--text5);font-weight:700;text-transform:uppercase}
  .cs-val{font-size:13px;font-weight:700;color:var(--text2);margin-top:2px}
  .card-footer{display:flex;align-items:center;justify-content:space-between}
  .stars span{font-size:13px}
  .progress-bar{background:var(--surface3);border-radius:100px;height:4px;margin-top:10px;overflow:hidden}
  .progress-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--indigo),var(--green))}

  /* BADGE */
  .badge{border-radius:6px;padding:2px 10px;font-size:11px;font-weight:700;display:inline-block}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:#00000099;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;width:100%;max-width:860px;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px #0009}
  .modal-header{background:linear-gradient(135deg,#0f172a,#1e1b4b);border-bottom:1px solid var(--border);padding:22px 26px 0;flex-shrink:0}
  .modal-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
  .modal-avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--violet));display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900}
  .modal-name{font-size:19px;font-weight:800}
  .modal-id{color:var(--violet);font-size:12px;font-weight:600;margin-top:2px}
  .close-btn{background:var(--surface3);border:none;color:var(--text3);width:32px;height:32px;border-radius:8px;font-size:15px}
  .tabs{display:flex;gap:2px;flex-wrap:wrap}
  .tab-btn{background:transparent;border:none;color:var(--text4);padding:9px 14px;border-radius:8px 8px 0 0;font-size:12px;font-weight:600;transition:.15s;white-space:nowrap}
  .tab-btn.active{background:var(--indigo);color:#fff}
  .modal-body{overflow-y:auto;padding:22px 26px;flex:1}
  .tab-content{display:none}
  .tab-content.active{display:block}

  /* FORM ELEMENTS */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .form-field{display:flex;flex-direction:column;gap:5px}
  .field-label{font-size:11px;color:var(--text4);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .field-input{background:var(--surface2);border:1px solid var(--border2);border-radius:9px;padding:10px 13px;font-size:13px;color:var(--text);width:100%}
  .field-input:focus{border-color:var(--indigo)}
  .field-input[disabled]{opacity:.5;cursor:not-allowed}
  .field-input.locked{opacity:.6;cursor:not-allowed;pointer-events:none}
  select.field-input{cursor:pointer}

  /* SAVE BTN */
  .save-btn{background:linear-gradient(135deg,var(--indigo),var(--violet));border:none;color:#fff;border-radius:10px;padding:11px 26px;font-size:14px;font-weight:700;transition:.2s;margin-top:12px}
  .save-btn:hover{opacity:.9}

  /* STATUS BUTTONS */
  .status-row{display:flex;gap:8px;flex-wrap:wrap}
  .status-btn{border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--surface2);color:var(--text4);transition:.15s}

  /* UPLOAD SECTION */
  .upload-box{background:var(--surface2);border:2px dashed var(--border2);border-radius:12px;padding:20px;margin-bottom:16px}
  .upload-box-title{color:var(--text3);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
  .upload-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
  .upload-submit-btn{background:var(--indigo);border:none;color:#fff;border-radius:9px;padding:10px 20px;font-size:13px;font-weight:700;transition:.2s;white-space:nowrap}
  .upload-submit-btn:hover{background:var(--violet)}

  /* VIDEO TABLE */
  .video-table{width:100%;border-collapse:collapse;margin-top:8px}
  .video-table th{color:var(--text4);font-size:11px;font-weight:700;text-transform:uppercase;padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
  .video-table td{padding:11px 10px;font-size:13px;color:var(--text2);border-bottom:1px solid #0d1117}
  .video-table tr:last-child td{border-bottom:none}
  .video-table tr:hover td{background:var(--surface2)}

  /* RATING */
  .rating-stars{display:flex;gap:4px}
  .star{font-size:22px;cursor:pointer;transition:.1s;color:var(--surface3)}
  .star.lit{color:var(--amber)}

  /* DOCS */
  .doc-item{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .doc-link-btn{color:var(--indigo);font-size:12px;font-weight:600;text-decoration:none;background:#1e1b4b;padding:5px 13px;border-radius:6px;border:1px solid #3730a3}
  .doc-link-btn:hover{background:#2d2a72}

  /* PERF */
  .perf-bar{background:var(--surface3);border-radius:100px;height:8px;overflow:hidden;margin-top:6px}
  .perf-fill{height:100%;border-radius:100px;transition:width .5s}

  /* PAYMENT TABLE */
  .pay-mark-btn{border-radius:6px;padding:4px 12px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid;transition:.15s}

  /* REVISION / ISSUE BOX */
  .revision-box{background:#ef444411;border:1px solid #ef444433;border-radius:10px;padding:14px;margin-top:8px}
  .revision-box label{color:var(--red);font-size:11px;font-weight:700;display:block;margin-bottom:6px}
  .revision-input{width:100%;background:var(--surface2);border:1px solid #ef444444;border-radius:8px;padding:9px 12px;font-size:13px;color:var(--text);resize:vertical;min-height:70px}
  .revision-link-input{width:100%;background:var(--surface2);border:1px solid #ef444444;border-radius:8px;padding:9px 12px;font-size:13px;color:var(--text);margin-top:6px}

  /* ISSUE SECTION (editor view) */
  .issue-card{background:#ef444409;border:1px solid #ef444440;border-radius:12px;padding:18px;margin-bottom:12px}
  .issue-card-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .issue-badge{background:#ef444422;color:var(--red);border:1px solid #ef444444;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700}
  .issue-vid-id{color:var(--violet);font-weight:700;font-size:14px}
  .issue-vid-title{color:var(--text3);font-size:12px}
  .issue-note-box{background:#0d1117;border:1px solid #ef444430;border-radius:8px;padding:12px;margin-bottom:10px;font-size:13px;color:var(--text2);line-height:1.5}
  .no-issues{text-align:center;padding:40px 20px;color:var(--text5)}

  /* EMPTY */
  .empty-state{text-align:center;padding:50px 20px;color:var(--text5)}
  .empty-icon{font-size:36px;margin-bottom:10px}
  .empty-text{font-size:15px;font-weight:600;color:var(--text4)}
  .empty-sub{font-size:12px;margin-top:4px}

  /* SECTION TITLE */
  .section-title{font-size:13px;font-weight:700;color:var(--text3);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}

  /* ADD EDITOR MODAL */
  .add-modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:480px;padding:28px;box-shadow:0 30px 80px #0009}

  /* 16th payment highlight */
  .payment-alert{background:#f59e0b11;border:1px solid #f59e0b44;border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--amber)}

  /* PROFILE SECTION */
  .profile-info-row{display:flex;align-items:center;gap:16px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px}
  .profile-avatar-lg{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--violet));display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;flex-shrink:0}
  .profile-name-block{flex:1}
  .profile-name{font-size:17px;font-weight:800}
  .profile-id-badge{color:var(--violet);font-size:12px;font-weight:600}

  /* Responsive */
  @media(max-width:600px){
    .form-grid{grid-template-columns:1fr}
    #main{padding:14px}
    .modal{border-radius:12px}
    .stats-row .stat-card{min-width:120px}
    .tab-btn{padding:7px 10px;font-size:11px}
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">J</div>
    <div class="login-title">J2A Studio</div>
    <div class="login-sub">Editor Management System</div>

    <div class="login-role-btns">
      <button class="login-role-btn active" onclick="setRole('admin')" id="role-admin">👑 Admin</button>
      <button class="login-role-btn" onclick="setRole('editor')" id="role-editor">✂️ Editor</button>
    </div>

    <div id="editor-select-wrap" style="display:none">
      <div class="pin-label">Select your Editor ID</div>
      <select class="editor-select" id="editor-select-login"></select>
    </div>

    <div class="pin-label">Enter PIN</div>
    <input class="pin-input" type="password" maxlength="4" id="pin-input" placeholder="••••" oninput="clearErr()" onkeydown="if(event.key==='Enter')doLogin()"/>
    <div class="login-err" id="login-err"></div>
    <button class="login-btn" onclick="doLogin()" style="margin-top:14px">Unlock</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none">

  <!-- NAVBAR -->
  <div id="navbar">
    <div class="nav-brand">
      <div class="nav-logo">J</div>
      <div class="nav-title">J2A <span>Studio</span></div>
      <span style="color:var(--border2);margin-left:4px;font-size:13px">/ Editor DB</span>
    </div>
    <div class="nav-right">
      <div class="nav-badge" id="nav-info"></div>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <div id="main">
    <!-- STATS -->
    <div class="stats-row" id="stats-row"></div>

    <!-- SEARCH + FILTER -->
    <div class="search-row" id="search-controls">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="search-input" placeholder="Search by name, ID, payment method..." oninput="renderCards()"/>
      </div>
      <div class="filter-btns" id="filter-btns">
        <button class="filter-btn active" onclick="setFilter('All',this)">All</button>
        <button class="filter-btn" onclick="setFilter('Active',this)">Active</button>
        <button class="filter-btn" onclick="setFilter('On Leave',this)">On Leave</button>
        <button class="filter-btn" onclick="setFilter('Suspended',this)">Suspended</button>
      </div>
      <button class="add-btn" id="add-editor-btn" onclick="openAddEditor()">+ Add Editor</button>
    </div>

    <div id="search-result-info" style="font-size:12px;color:var(--text4);margin-bottom:10px;min-height:18px"></div>

    <!-- CARDS -->
    <div class="editor-grid" id="editor-grid"></div>
  </div>
</div>

<!-- EDITOR DETAIL MODAL -->
<div class="modal-overlay" id="editor-modal" style="display:none" onclick="closeModalOnOverlay(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-top">
        <div style="display:flex;align-items:center;gap:12px">
          <div class="modal-avatar" id="m-avatar"></div>
          <div>
            <div class="modal-name" id="m-name"></div>
            <div class="modal-id" id="m-id"></div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span id="m-status-badge"></span>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
      </div>
      <div class="tabs" id="modal-tabs"></div>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- ADD EDITOR MODAL -->
<div class="modal-overlay" id="add-modal" style="display:none" onclick="if(event.target===this)closeAddModal()">
  <div class="add-modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div style="font-size:17px;font-weight:800">Add New Editor</div>
      <button class="close-btn" onclick="closeAddModal()">✕</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:13px">
      <div class="form-field">
        <span class="field-label">Full Name</span>
        <input class="field-input" id="ae-name" placeholder="e.g. Ahmed Khan"/>
      </div>
      <div class="form-grid">
        <div class="form-field">
          <span class="field-label">Payment Method</span>
          <select class="field-input" id="ae-method">
            <option>JazzCash</option><option>EasyPaisa</option><option>Bank Transfer</option><option>PayPal</option><option>USDT</option>
          </select>
        </div>
        <div class="form-field">
          <span class="field-label">Account / Number</span>
          <input class="field-input" id="ae-account" placeholder="03XX-XXXXXXX"/>
        </div>
      </div>
      <div class="form-grid">
        <div class="form-field">
          <span class="field-label">Rate per Video (Rs)</span>
          <input class="field-input" id="ae-rate" type="number" value="1000"/>
        </div>
        <div class="form-field">
          <span class="field-label">Editor PIN (4 digits)</span>
          <input class="field-input" id="ae-pin" type="password" maxlength="4" placeholder="••••"/>
        </div>
      </div>
      <button class="save-btn" onclick="addEditor()" style="margin-top:4px">Add Editor</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
const ADMIN_PIN = '5658';
let db = JSON.parse(localStorage.getItem('j2a_db') || 'null') || {
  editors: [
    {
      id:'J2A-001', name:'Asad Malik', pin:'1111',
      joinDate:'2025-01-01', status:'Active',
      paymentMethod:'JazzCash', accountNumber:'03001234567', ratePerVideo:1500,
      videos:[
        {id:'VID-001',title:'Intro Video',driveLink:'https://drive.google.com',status:'Approved',submittedDate:'2025-01-10',paid:true,rating:9,revisionNote:'',revisionLink:''},
        {id:'VID-002',title:'Tutorial Ep1',driveLink:'https://drive.google.com',status:'Submitted',submittedDate:'2025-02-01',paid:false,rating:0,revisionNote:'',revisionLink:''},
      ],
      docs:[
        {title:'Script - Intro Video',link:'https://drive.google.com',date:'2025-01-08'}
      ]
    },
    {
      id:'J2A-002', name:'Sara Khan', pin:'2222',
      joinDate:'2025-01-15', status:'Active',

      videos:[

function saveDb(){ localStorage.setItem('j2a_db', JSON.stringify(db)); }
function getEditor(id){ return db.editors.find(e=>e.id===id); }
function getEditorPerf(ed){
  const total = ed.videos.length;
  const approved = ed.videos.filter(v=>v.status==='Approved').length;
  const revision = ed.videos.filter(v=>v.status==='Revision').length;
  const rated = ed.videos.filter(v=>v.rating>0);
  const avgRating = rated.length ? (rated.reduce((s,v)=>s+v.rating,0)/rated.length).toFixed(1) : '—';
  const earned = approved * ed.ratePerVideo;
  const paid = ed.videos.filter(v=>v.paid).length * ed.ratePerVideo;
  return {total,approved,revision,avgRating,earned,paid,pending:earned-paid};
}

// ─── AUTH ────────────────────────────────────────────────────────────────────
function setRole(role){
  loginRole = role;
  document.getElementById('role-admin').className = 'login-role-btn' + (role==='admin'?' active':'');
  document.getElementById('role-editor').className = 'login-role-btn' + (role==='editor'?' active':'');
  const wrap = document.getElementById('editor-select-wrap');
  if(role==='editor'){
    wrap.style.display='block';
    const sel = document.getElementById('editor-select-login');
    sel.innerHTML = db.editors.map(e=>`<option value="${e.id}">${e.id} — ${e.name}</option>`).join('');
  } else { wrap.style.display='none'; }
}

function doLogin(){
  const pin = document.getElementById('pin-input').value.trim();
  if(loginRole==='admin'){
    if(pin===ADMIN_PIN){ currentUser={role:'admin'}; showApp(); }
    else { showErr('Wrong PIN. Try again.'); }
  } else {
    const edId = document.getElementById('editor-select-login').value;
    const ed = getEditor(edId);
    if(ed && ed.pin===pin){ currentUser={role:'editor', editorId:edId}; showApp(); }
    else { showErr('Wrong PIN for this editor.'); }
  }
}
function showErr(msg){ document.getElementById('login-err').textContent=msg; }
function clearErr(){ document.getElementById('login-err').textContent=''; }

function showApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('pin-input').value='';
  const isAdmin = currentUser.role==='admin';
  if(isAdmin){
    document.getElementById('nav-info').innerHTML=`👑 Admin · <b>${db.editors.length}</b> editors`;
    document.getElementById('search-controls').style.display='flex';
    document.getElementById('add-editor-btn').style.display='inline-block';
  } else {
    const ed = getEditor(currentUser.editorId);
    document.getElementById('nav-info').innerHTML=`✂️ <b>${ed.name}</b> · ${ed.id}`;
    document.getElementById('search-controls').style.display='none';
    document.getElementById('add-editor-btn').style.display='none';
  }
  renderStats();
  renderCards();
  // If editor, auto open their profile
  if(!isAdmin){ openEditor(currentUser.editorId); }
  // Show AI notif dot after a moment
  setTimeout(()=>{ if(typeof showAiNotif==='function') showAiNotif(); }, 1500);
}

function doLogout(){
  currentUser=null; selectedEditorId=null;
  // Reset AI
  aiHistory=[]; aiOpen=false; aiFirstOpen=true;

  if(win) win.classList.remove('open');

// ─── STATS ───────────────────────────────────────────────────────────────────
function renderStats(){
  const isAdmin = currentUser.role==='admin';
  let editors = isAdmin ? db.editors : [getEditor(currentUser.editorId)];
  const totalVideos = editors.reduce((s,e)=>s+e.videos.length,0);
  const totalPaid = editors.reduce((s,e)=>s+e.videos.filter(v=>v.paid).length*e.ratePerVideo,0);
  const totalPending = editors.reduce((s,e)=>s+e.videos.filter(v=>!v.paid&&v.status==='Approved').length*e.ratePerVideo,0);
  const approved = editors.reduce((s,e)=>s+e.videos.filter(v=>v.status==='Approved').length,0);

  const row = document.getElementById('stats-row');
  if(isAdmin){
    row.innerHTML=`
      <div class="stat-card" style="border-left:3px solid var(--indigo)"><div class="stat-label">Total Editors</div><div class="stat-value" style="color:var(--indigo)">${db.editors.length}</div><div class="stat-sub">${db.editors.filter(e=>e.status==='Active').length} active</div></div>
      <div class="stat-card" style="border-left:3px solid var(--text3)"><div class="stat-label">Total Videos</div><div class="stat-value">${totalVideos}</div><div class="stat-sub">${approved} approved</div></div>
      <div class="stat-card" style="border-left:3px solid var(--green)"><div class="stat-label">Paid Out</div><div class="stat-value" style="color:var(--green)">Rs ${totalPaid.toLocaleString()}</div></div>
      <div class="stat-card" style="border-left:3px solid var(--amber)"><div class="stat-label">Pending Payment</div><div class="stat-value" style="color:var(--amber)">Rs ${totalPending.toLocaleString()}</div></div>
    `;
  } else {
    const ed = editors[0];
    const p = getEditorPerf(ed);
    const issueCount = ed.videos.filter(v=>v.status==='Revision').length;
    row.innerHTML=`
      <div class="stat-card" style="border-left:3px solid var(--indigo)"><div class="stat-label">Total Earned</div><div class="stat-value" style="color:var(--indigo)">Rs ${p.earned.toLocaleString()}</div></div>
      <div class="stat-card" style="border-left:3px solid var(--green)"><div class="stat-label">Paid Out</div><div class="stat-value" style="color:var(--green)">Rs ${p.paid.toLocaleString()}</div></div>
      <div class="stat-card" style="border-left:3px solid var(--amber)"><div class="stat-label">Pending</div><div class="stat-value" style="color:var(--amber)">Rs ${p.pending.toLocaleString()}</div></div>
      <div class="stat-card" style="border-left:3px solid var(--text3)"><div class="stat-label">My Videos</div><div class="stat-value">${p.total}</div><div class="stat-sub">${p.approved} approved</div></div>
      ${issueCount>0?`<div class="stat-card" style="border-left:3px solid var(--red)"><div class="stat-label">Active Issues</div><div class="stat-value" style="color:var(--red)">${issueCount}</div><div class="stat-sub">Need revision</div></div>`:''}
    `;
  }
}

// ─── CARDS ───────────────────────────────────────────────────────────────────
function setFilter(f, btn){
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function renderCards(){
  const isAdmin = currentUser.role==='admin';
  const q = (document.getElementById('search-input')?.value||'').toLowerCase();
  let editors = isAdmin ? db.editors : [getEditor(currentUser.editorId)];
  let filtered = editors.filter(e=>{
    const matchFilter = activeFilter==='All' || e.status===activeFilter;
    const matchQ = !q || e.name.toLowerCase().includes(q) || e.id.toLowerCase().includes(q) || e.paymentMethod.toLowerCase().includes(q);
    return matchFilter && matchQ;
  });
  const info = document.getElementById('search-result-info');
  if(info){ info.textContent = q ? `${filtered.length} result${filtered.length!==1?'s':''} for "${q}"` : ''; }

  const grid = document.getElementById('editor-grid');
  if(!filtered.length){
    grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🔍</div><div class="empty-text">No editors found</div><div class="empty-sub">Try different search terms</div></div>`;
    return;
  }
  grid.innerHTML = filtered.map(ed=>{
    const p = getEditorPerf(ed);
    const approvalRate = p.total>0 ? Math.round((p.approved/p.total)*100) : 100;
    const sc = statusColor(ed.status);
    const stars = p.avgRating!=='—' ? renderStarsSmall(parseFloat(p.avgRating)) : '—';
    const issueCount = ed.videos.filter(v=>v.status==='Revision').length;
    return `<div class="editor-card" onclick="openEditor('${ed.id}')">
      <div class="card-head">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="card-avatar">${ed.name[0]}</div>
          <div><div class="card-name">${ed.name}</div><div class="card-id">${ed.id}</div></div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          <span class="badge" style="background:${sc}22;color:${sc};border:1px solid ${sc}44">${ed.status}</span>
          ${issueCount>0?`<span class="badge" style="background:#ef444422;color:var(--red);border:1px solid #ef444444">⚠️ ${issueCount} issue${issueCount>1?'s':''}</span>`:''}
        </div>
      </div>
      <div class="card-stats">
        <div class="card-stat"><div class="cs-label">Earned</div><div class="cs-val">Rs ${p.earned.toLocaleString()}</div></div>
        <div class="card-stat"><div class="cs-label">Pending</div><div class="cs-val">Rs ${p.pending.toLocaleString()}</div></div>
        <div class="card-stat"><div class="cs-label">Rate/Video</div><div class="cs-val">Rs ${ed.ratePerVideo.toLocaleString()}</div></div>
        <div class="card-stat"><div class="cs-label">Approval</div><div class="cs-val">${approvalRate}%</div></div>
      </div>
      <div class="card-footer">
        <span style="color:var(--text4);font-size:12px">💳 ${ed.paymentMethod}</span>
        <span style="font-size:12px">${stars}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${approvalRate}%;background:${approvalRate>=80?'linear-gradient(90deg,var(--indigo),var(--green))':'linear-gradient(90deg,var(--red),var(--amber))'}"></div></div>
    </div>`;
  }).join('');
}

function statusColor(s){
  return {Active:'#22c55e','On Leave':'#f59e0b',Suspended:'#ef4444',Probation:'#a78bfa'}[s]||'#9ca3af';
}
function videoStatusColor(s){
  return {Approved:'#22c55e',Pending:'#f59e0b',Revision:'#ef4444',Submitted:'#60a5fa'}[s]||'#9ca3af';
}
function renderStarsSmall(r){
  let out='';
  for(let i=1;i<=5;i++) out+=`<span style="color:${i<=Math.round(r)?'#f59e0b':'#374151'};font-size:13px">★</span>`;
  out+=`<span style="color:var(--text4);font-size:11px;margin-left:3px">${r}/10</span>`;
  return out;
}

const EDITOR_TABS = ['upload','issues','docs','payment','performance','profile'];

  upload:'📤 Video Upload',

  issues:'⚠️ Issues',

function openEditor(id){
  selectedEditorId = id;
  const ed = getEditor(id);
  document.getElementById('m-avatar').textContent = ed.name[0];
  document.getElementById('m-name').textContent = ed.name;
  document.getElementById('m-id').textContent = ed.id;
  const sc = statusColor(ed.status);
  document.getElementById('m-status-badge').innerHTML=`<span class="badge" style="background:${sc}22;color:${sc};border:1px solid ${sc}44">${ed.status}</span>`;

  currentTab = tabs[0];

  document.getElementById('modal-tabs').innerHTML = tabs.map(t=>{
    let label = TAB_LABELS[t];

      if(cnt>0) label += ` <span style="background:var(--red);color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;margin-left:4px">${cnt}</span>`;
    }
    return `<button class="tab-btn ${t===currentTab?'active':''}" onclick="switchTab('${t}')">${label}</button>`;

  renderModalBody();

}

function switchTab(t){
  currentTab = t;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    // Match by start of text content (ignoring badge spans)
    b.classList.toggle('active', b.getAttribute('onclick')===`switchTab('${t}')`);
  });
  renderModalBody();
}

function closeModal(){
  document.getElementById('editor-modal').style.display='none';
  selectedEditorId=null;
  renderStats();
  renderCards();
}
function closeModalOnOverlay(e){ if(e.target===document.getElementById('editor-modal')) closeModal(); }

function renderModalBody(){
  const ed = getEditor(selectedEditorId);
  const body = document.getElementById('modal-body');
  const isAdmin = currentUser.role==='admin';
  if(currentTab==='upload')       body.innerHTML = renderUploadTab(ed, isAdmin);
  else if(currentTab==='payment') body.innerHTML = renderPaymentTab(ed, isAdmin);
  else if(currentTab==='docs')    body.innerHTML = renderDocsTab(ed, isAdmin);
  else if(currentTab==='performance') body.innerHTML = renderPerfTab(ed);
  else if(currentTab==='settings')    body.innerHTML = renderSettingsTab(ed);
  else if(currentTab==='issues')      body.innerHTML = renderIssuesTab(ed);
  else if(currentTab==='profile')     body.innerHTML = renderProfileTab(ed);
}

// ─── ISSUES TAB (EDITOR ONLY) ─────────────────────────────────────────────────
function renderIssuesTab(ed){
  const revVideos = ed.videos.filter(v=>v.status==='Revision');

      </div>
      ${v.revisionLink?`

        <a href="${v.revisionLink}" target="_blank" style="display:inline-flex;align-items:center;gap:8px;background:#6366f122;border:1px solid #6366f144;color:var(--indigo);border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;text-decoration:none">

function renderPerfTab(ed){

  const revRate = p.total>0?Math.round((p.revision/p.total)*100):0;

  let html=`<div class="stats-row" style="margin-bottom:20px">
    <div class="stat-card"><div class="stat-label">Total Videos</div><div class="stat-value">${p.total}</div></div>
    <div class="stat-card" style="border-left:3px solid var(--green)"><div class="stat-label">Approved</div><div class="stat-value" style="color:var(--green)">${p.approved}</div></div>
    <div class="stat-card" style="border-left:3px solid var(--red)"><div class="stat-label">Revisions</div><div class="stat-value" style="color:var(--red)">${p.revision}</div></div>
    <div class="stat-card" style="border-left:3px solid var(--amber)"><div class="stat-label">Avg Rating</div><div class="stat-value" style="color:var(--amber)">${p.avgRating}${p.avgRating!=='—'?'/10':''}</div></div>
  </div>`;

  html+=`<div style="background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px">
    <div class="section-title" style="border:none;padding:0;margin-bottom:16px">Approval Rate</div>
    <div class="perf-bar"><div class="perf-fill" style="width:${approvalRate}%;background:${approvalRate>=80?'linear-gradient(90deg,var(--indigo),var(--green))':'linear-gradient(90deg,var(--red),var(--amber))'}"></div></div>
    <div style="color:var(--text3);font-size:12px;margin-top:6px">${p.approved}/${p.total} approved (${approvalRate}%)</div>
    <div style="margin-top:14px">
      <div style="color:var(--text4);font-size:11px;margin-bottom:4px;font-weight:700">Revision Rate</div>
      <div class="perf-bar"><div class="perf-fill" style="width:${revRate}%;background:linear-gradient(90deg,var(--red),var(--amber))"></div></div>
      <div style="color:var(--text3);font-size:12px;margin-top:4px">${p.revision} revisions out of ${p.total} videos</div>
    </div>
  </div>`;

  if(ed.videos.filter(v=>v.rating>0).length){
    html+=`<div style="background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:20px">
      <div class="section-title" style="border:none;padding:0;margin-bottom:14px">Video Ratings</div>`;
    ed.videos.filter(v=>v.rating>0).forEach(v=>{
      const w = (v.rating/10)*100;
      html+=`<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:13px;color:var(--text2)">${v.id} — ${v.title}</span>
          <span style="color:var(--amber);font-weight:700;font-size:13px">${v.rating}/10</span>
        </div>
        <div class="perf-bar"><div class="perf-fill" style="width:${w}%;background:linear-gradient(90deg,var(--indigo),var(--amber))"></div></div>
      </div>`;
    });
    html+=`</div>`;
  }
  return html;
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
function submitVideo(){
  const vid = document.getElementById('upl-vid-id')?.value.trim();
  const title = document.getElementById('upl-vid-title')?.value.trim();
  const link = document.getElementById('upl-drive-link')?.value.trim();
  if(!vid||!title){ return showToast('Video ID aur Title zaroori hai!','error'); }
  const ed = getEditor(selectedEditorId);
  if(ed.videos.find(v=>v.id===vid)){ return showToast('Yeh Video ID already exist karta hai!','error'); }
  ed.videos.push({
    id:vid, title, driveLink:link||'',
    status:'Submitted',
    submittedDate:new Date().toISOString().slice(0,10),
    paid:false, rating:0, revisionNote:'', revisionLink:''
  });
  saveDb();
  showToast('Video submit ho gayi! Status: Submitted ✓');
  renderModalBody();
}

function openReviewPanel(i){
  const panel = document.getElementById(`review-panel-${i}`);
  if(panel) panel.style.display = panel.style.display==='none'?'table-row':'none';
}
function toggleRevisionForm(i){
  const f = document.getElementById(`revision-form-${i}`);
  if(f) f.style.display = f.style.display==='none'?'block':'none';
}
function toggleReuploadPanel(i){
  const panel = document.getElementById(`reupload-panel-${i}`);
  if(panel) panel.style.display = panel.style.display==='none'?'table-row':'none';
}
function reuploadVideo(i){
  const newLink = document.getElementById(`reup-link-${i}`)?.value.trim();
  if(!newLink){ return showToast('Naya Drive link daalo!','error'); }
  const ed = getEditor(selectedEditorId);
  ed.videos[i].driveLink = newLink;
  ed.videos[i].status = 'Submitted';
  ed.videos[i].revisionNote = '';
  ed.videos[i].revisionLink = '';
  ed.videos[i].submittedDate = new Date().toISOString().slice(0,10);
  saveDb();
  showToast('Video re-submit ho gayi! Admin review karega ✓');
  renderModalBody();
  renderStats();
  renderCards();
}
function toggleIssueReupload(id){
  const el = document.getElementById(id);
  if(el) el.style.display = el.style.display==='none'?'block':'none';
}
function reuploadFromIssues(i){
  const newLink = document.getElementById(`iru-link-${i}`)?.value.trim();
  if(!newLink){ return showToast('Naya Drive link daalo!','error'); }
  const ed = getEditor(selectedEditorId);
  ed.videos[i].driveLink = newLink;
  ed.videos[i].status = 'Submitted';
  ed.videos[i].revisionNote = '';
  ed.videos[i].revisionLink = '';
  ed.videos[i].submittedDate = new Date().toISOString().slice(0,10);
  saveDb();
  showToast('Video re-submit ho gayi! Admin review karega ✓');
  renderModalBody();
  renderStats();
  renderCards();
}

let hoverRatingMap = {};
function setRating(i, n){
  const ed = getEditor(selectedEditorId);
  tempRating = n;
  ed.videos[i].rating = n;
  saveDb();
  refreshStars(i, n);
  document.getElementById(`rating-display-${i}`).textContent = n+'/10';
}
function hoverRating(i, n){ refreshStars(i, n); }
function unhoverRating(i){
  const ed = getEditor(selectedEditorId);
  refreshStars(i, ed.videos[i].rating);
}
function refreshStars(i, n){
  const container = document.getElementById(`stars-${i}`);
  if(!container) return;
  container.querySelectorAll('.star').forEach(s=>{
    s.classList.toggle('lit', parseInt(s.dataset.val)<=n);
  });
}

function approveVideo(i){
  const ed = getEditor(selectedEditorId);
  const v = ed.videos[i];
  if(!v.rating){ return showToast('Pehle rating do!','error'); }
  v.status='Approved';
  saveDb();
  showToast(`Video ${v.id} Approved ✓`);
  renderModalBody();
}

function sendRevision(i){
  const ed = getEditor(selectedEditorId);
  const note = document.getElementById(`rev-note-${i}`)?.value.trim();
  const link = document.getElementById(`rev-link-${i}`)?.value.trim();
  if(!note){ return showToast('Issue description likho!','error'); }
  ed.videos[i].status='Revision';
  ed.videos[i].revisionNote=note;
  ed.videos[i].revisionLink=link||'';
  saveDb();
  showToast('Issue editor ko bhej diya ⚠️');
  renderModalBody();
}

function togglePaid(i){
  const ed = getEditor(selectedEditorId);
  if(ed.videos[i].status!=='Approved') return;
  ed.videos[i].paid=!ed.videos[i].paid;
  saveDb();
  renderModalBody();
  renderStats();
}

function markAllPaid(){
  const ed = getEditor(selectedEditorId);
  ed.videos.forEach(v=>{ if(v.status==='Approved') v.paid=true; });
  saveDb();
  showToast('Sab approved videos paid mark ho gayi ✓');
  renderModalBody();
  renderStats();
}

function addDoc(){
  const title = document.getElementById('doc-title')?.value.trim();
  const link = document.getElementById('doc-link')?.value.trim();
  if(!title){ return showToast('Document title zaroori hai!','error'); }
  const ed = getEditor(selectedEditorId);
  ed.docs.push({title, link:link||'', date:new Date().toISOString().slice(0,10)});
  saveDb();
  showToast('Document bhej diya ✓');
  renderModalBody();
}

function deleteDoc(i){
  if(!confirm('Is document ko delete karo?')) return;
  const ed = getEditor(selectedEditorId);
  ed.docs.splice(i,1);
  saveDb();
  showToast('Document delete ho gaya');
  renderModalBody();
}

let tempStatus = null;
function setStatus(s){
  tempStatus = s;
  document.querySelectorAll('.status-btn').forEach(btn=>{
    const sc = statusColor(btn.textContent.trim());
    const active = btn.textContent.trim()===s;
    btn.style.cssText = active
      ? `background:${sc}22;border-color:${sc};color:${sc};border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid;transition:.15s`
      : 'background:var(--surface2);border:1px solid var(--border);color:var(--text4);border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s';
  });
}

function saveSettings(){
  const ed = getEditor(selectedEditorId);
  ed.name = document.getElementById('s-name')?.value.trim() || ed.name;
  ed.joinDate = document.getElementById('s-join')?.value || ed.joinDate;
  ed.ratePerVideo = parseInt(document.getElementById('s-rate')?.value) || ed.ratePerVideo;
  ed.paymentMethod = document.getElementById('s-method')?.value || ed.paymentMethod;
  ed.accountNumber = document.getElementById('s-account')?.value.trim() || ed.accountNumber;
  const newPin = document.getElementById('s-pin')?.value.trim();
  if(newPin && newPin.length===4) ed.pin = newPin;
  if(tempStatus) ed.status = tempStatus;
  saveDb();
  tempStatus = null;
  showToast('Settings save ho gayi ✓');
  document.getElementById('m-name').textContent = ed.name;
  const sc2 = statusColor(ed.status);
  document.getElementById('m-status-badge').innerHTML=`<span class="badge" style="background:${sc2}22;color:${sc2};border:1px solid ${sc2}44">${ed.status}</span>`;
  renderCards();
}

// Editor saves own profile
function saveEditorProfile(){
  const ed = getEditor(selectedEditorId);
  const newName = document.getElementById('p-name')?.value.trim();
  const newMethod = document.getElementById('p-method')?.value;
  const newAccount = document.getElementById('p-account')?.value.trim();
  const oldPin = document.getElementById('p-old-pin')?.value.trim();
  const newPin = document.getElementById('p-new-pin')?.value.trim();

  if(newName) ed.name = newName;
  if(newMethod) ed.paymentMethod = newMethod;
  if(newAccount) ed.accountNumber = newAccount;

  // PIN change needs old PIN verification
  if(newPin){
    if(!oldPin){ return showToast('PIN change ke liye purana PIN bhi likho!','error'); }
    if(oldPin !== ed.pin){ return showToast('Purana PIN galat hai!','error'); }
    if(newPin.length !== 4){ return showToast('Naya PIN 4 digits ka hona chahiye!','error'); }
    ed.pin = newPin;
    showToast('Profile aur PIN save ho gaya ✓');
  } else {
    showToast('Profile save ho gaya ✓');
  }

  saveDb();
  document.getElementById('m-name').textContent = ed.name;
  renderCards();
  renderModalBody();
}

function deleteEditor(){
  if(!confirm('Kya sach mein is editor ko delete karna hai? Yeh undo nahi hoga.')) return;
  db.editors = db.editors.filter(e=>e.id!==selectedEditorId);
  saveDb();
  closeModal();
  showToast('Editor delete ho gaya');
}

// ─── ADD EDITOR ──────────────────────────────────────────────────────────────
function openAddEditor(){ document.getElementById('add-modal').style.display='flex'; }
function closeAddModal(){ document.getElementById('add-modal').style.display='none'; }

function addEditor(){
  const name = document.getElementById('ae-name').value.trim();
  const pin = document.getElementById('ae-pin').value.trim();
  if(!name){ return showToast('Naam zaroori hai!','error'); }
  if(!pin||pin.length!==4){ return showToast('PIN 4 digits ka hona chahiye!','error'); }
  const num = db.editors.length+1;
  const id = 'J2A-'+String(num).padStart(3,'0');
  db.editors.push({
    id, name, pin,
    joinDate: new Date().toISOString().slice(0,10),
    status: 'Active',
    paymentMethod: document.getElementById('ae-method').value,
    accountNumber: document.getElementById('ae-account').value.trim(),
    ratePerVideo: parseInt(document.getElementById('ae-rate').value)||1000,
    videos:[], docs:[]
  });
  saveDb();
  closeAddModal();
  showToast(`Editor ${id} add ho gaya ✓`);
  renderStats();
  renderCards();
  const sel = document.getElementById('editor-select-login');
  if(sel) sel.innerHTML = db.editors.map(e=>`<option value="${e.id}">${e.id} — ${e.name}</option>`).join('');
}

// ─── TOAST ───────────────────────────────────────────────────────────────────
function showToast(msg, type='success'){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = type==='error'?'var(--red)':'var(--green)';
  t.style.color = type==='error'?'var(--red)':'var(--green)';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}
</script>

<!-- Floating Button -->
<button id="ai-fab" onclick="toggleAiChat()" title="J2A AI Assistant">
  🤖
  <div class="ai-notif" id="ai-notif"></div>
</button>

<!-- Chat Window -->
<div id="ai-chat-win">
  <div class="ai-header">
    <div class="ai-avatar">🤖</div>
    <div>
      <div class="ai-title">J2A AI Assistant</div>
      <div class="ai-subtitle">Studio data + editing help</div>
    </div>
    <button class="ai-close-btn" onclick="toggleAiChat()">✕</button>
  </div>

  <div id="ai-messages"></div>

  <div class="ai-suggestions" id="ai-suggestions"></div>

  <div class="ai-input-area">
    <textarea id="ai-input" rows="1" placeholder="Kuch bhi poochho..." onkeydown="aiInputKeydown(event)" oninput="aiInputResize(this)"></textarea>
    <button id="ai-send-btn" onclick="aiSend()">➤</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// AI ASSISTANT LOGIC
// ═══════════════════════════════════════════════════════
let aiHistory = [];
let aiOpen = false;
let aiFirstOpen = true;

const ADMIN_SUGGESTIONS = [
  '📊 Is hafte ka summary do',
  '🏆 Best editor kaun hai?',
  '💰 Pending payments kitni hain?',
  '✍️ Revision note likho',
];
const EDITOR_SUGGESTIONS = [
  '💰 Meri earnings kitni hain?',
  '📈 Mera approval rate kya hai?',
  '🎬 Editing tips do',
  '⚠️ Mera issue explain karo',
];

function toggleAiChat(){
  aiOpen = !aiOpen;
  const win = document.getElementById('ai-chat-win');
  win.classList.toggle('open', aiOpen);
  document.getElementById('ai-notif').style.display = 'none';

  if(aiOpen && aiFirstOpen && currentUser){
    aiFirstOpen = false;
    renderAiSuggestions();
    // Welcome message
    const isAdmin = currentUser.role==='admin';
    const ed = isAdmin ? null : getEditor(currentUser.editorId);
    const welcome = isAdmin
      ? `👋 Salam! Main J2A Studio ka AI Assistant hoon.\n\nMujhe studio ka poora data pata hai — editors, videos, payments, performance sab.\n\nKya jaanna chahte ho?`
      : `👋 Salam ${ed.name}! Main tumhara AI Assistant hoon.\n\nTumhari earnings, videos, issues — sab ke baare mein poochh sakte ho. Video editing tips bhi deta hoon!\n\nKya help chahiye?`;
    addAiMsg('bot', welcome);
  }
  if(aiOpen) document.getElementById('ai-input').focus();
}

function renderAiSuggestions(){
  const isAdmin = currentUser && currentUser.role==='admin';
  const chips = isAdmin ? ADMIN_SUGGESTIONS : EDITOR_SUGGESTIONS;
  document.getElementById('ai-suggestions').innerHTML = chips.map(c=>
    `<button class="ai-chip" onclick="aiChipClick(this)">${c}</button>`
  ).join('');
}

function aiChipClick(btn){
  document.getElementById('ai-input').value = btn.textContent;
  document.getElementById('ai-suggestions').innerHTML = '';
  aiSend();
}

function addAiMsg(role, text){
  const box = document.getElementById('ai-messages');
  const div = document.createElement('div');
  div.className = `ai-msg ${role}`;
  div.style.whiteSpace = 'pre-wrap';
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

function addAiTyping(){
  const box = document.getElementById('ai-messages');
  const div = document.createElement('div');
  div.className = 'ai-msg bot thinking';
  div.id = 'ai-typing-indicator';
  div.innerHTML = '<div class="ai-typing"><div class="ai-dot"></div><div class="ai-dot"></div><div class="ai-dot"></div></div>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function removeAiTyping(){
  const el = document.getElementById('ai-typing-indicator');
  if(el) el.remove();
}

function buildSystemPrompt(){
  const isAdmin = currentUser && currentUser.role==='admin';
  const now = new Date().toLocaleDateString('ur-PK');

  // Build studio data snapshot
  let dataStr = '';
  if(isAdmin){
    dataStr += `\nSTUDIO OVERVIEW:\n`;
    dataStr += `- Total editors: ${db.editors.length}\n`;
    dataStr += `- Active: ${db.editors.filter(e=>e.status==='Active').length}\n`;
    const allVids = db.editors.flatMap(e=>e.videos);
    const approved = allVids.filter(v=>v.status==='Approved').length;
    const submitted = allVids.filter(v=>v.status==='Submitted').length;
    const revision = allVids.filter(v=>v.status==='Revision').length;
    const totalPaid = db.editors.reduce((s,e)=>s+e.videos.filter(v=>v.paid).length*e.ratePerVideo,0);
    const totalPending = db.editors.reduce((s,e)=>s+e.videos.filter(v=>!v.paid&&v.status==='Approved').length*e.ratePerVideo,0);
    dataStr += `- Total videos: ${allVids.length} (${approved} approved, ${submitted} submitted, ${revision} in revision)\n`;
    dataStr += `- Total paid out: Rs ${totalPaid.toLocaleString()}\n`;
    dataStr += `- Pending payments: Rs ${totalPending.toLocaleString()}\n\n`;
    dataStr += `EDITORS DETAIL:\n`;
    db.editors.forEach(e=>{
      const p = getEditorPerf(e);
      dataStr += `• ${e.name} (${e.id}) — Status: ${e.status}, Rate: Rs ${e.ratePerVideo}/video, Earned: Rs ${p.earned.toLocaleString()}, Pending: Rs ${p.pending.toLocaleString()}, Avg Rating: ${p.avgRating}, Videos: ${p.total} (${p.approved} approved, ${p.revision} revision)\n`;
    });
  } else {
    const ed = getEditor(currentUser.editorId);
    const p = getEditorPerf(ed);
    dataStr += `\nEDITOR INFO:\n`;
    dataStr += `- Name: ${ed.name}, ID: ${ed.id}\n`;
    dataStr += `- Status: ${ed.status}\n`;
    dataStr += `- Rate per video: Rs ${ed.ratePerVideo}\n`;
    dataStr += `- Payment method: ${ed.paymentMethod}\n`;
    dataStr += `- Total videos: ${p.total}\n`;
    dataStr += `- Approved: ${p.approved}, Revision: ${p.revision}\n`;
    dataStr += `- Avg Rating: ${p.avgRating}/10\n`;
    dataStr += `- Total Earned: Rs ${p.earned.toLocaleString()}\n`;
    dataStr += `- Paid out: Rs ${p.paid.toLocaleString()}\n`;
    dataStr += `- Pending: Rs ${p.pending.toLocaleString()}\n`;
    dataStr += `- Approval rate: ${p.total>0?Math.round((p.approved/p.total)*100):100}%\n`;
    const revVids = ed.videos.filter(v=>v.status==='Revision');
    if(revVids.length){
      dataStr += `\nACTIVE ISSUES:\n`;
      revVids.forEach(v=>{ dataStr += `  • ${v.id} "${v.title}": ${v.revisionNote||'No note'}\n`; });
    }
  }

  return `Tum J2A Studio ka AI Assistant ho. J2A Studio ek YouTube/video editing studio hai jo Pakistan mein based hai.

Tumhara kaam hai:
1. Studio ka data dekh ke sawal jawab karna (earnings, stats, performance, videos, payments)
2. Video editing tips aur guidance dena
3. Revision notes, scripts ya koi bhi text draft karne mein help karna
4. Urdu/Roman Urdu mein baat karna (user jo language use kare, tum usi mein jawab do)

CURRENT USER: ${currentUser.role==='admin'?'Admin (owner)':'Editor: '+(getEditor(currentUser.editorId)?.name||'')}
DATE: ${now}

LIVE STUDIO DATA:
${dataStr}

RULES:
- Chhote, clear jawab do — long paragraphs mat likho jab tak zaroorat na ho
- Numbers aur facts data se lo, apni taraf se mat banao
- Friendly aur helpful raho — professional but casual tone
- Agar koi cheez data mein nahi hai to honestly bolo
- Roman Urdu default rakho, lekin user ki bhasha follow karo`;
}

async function aiSend(){
  const input = document.getElementById('ai-input');
  const msg = input.value.trim();
  if(!msg || !currentUser) return;

  input.value = '';
  aiInputResize(input);
  document.getElementById('ai-send-btn').disabled = true;
  document.getElementById('ai-suggestions').innerHTML = '';

  addAiMsg('user', msg);
  addAiTyping();

  aiHistory.push({role:'user', content: msg});

  try {
    const response = await fetch('https://zytrix-team.jediakhtar786.workers.dev', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: buildSystemPrompt(),
        messages: aiHistory
      })
    });

    const data = await response.json();
    removeAiTyping();

    if(data.content && data.content[0]){
      const reply = data.content[0].text;
      aiHistory.push({role:'assistant', content: reply});
      addAiMsg('bot', reply);
      // Keep history max 20 messages to avoid token limit
      if(aiHistory.length > 20) aiHistory = aiHistory.slice(-20);
    } else {
      addAiMsg('bot', '❌ Jawab nahi aaya. Thodi der baad try karo.');
    }
  } catch(err) {
    removeAiTyping();
    addAiMsg('bot', '❌ Connection error. Internet check karo aur dobara try karo.');
  }

  document.getElementById('ai-send-btn').disabled = false;
  document.getElementById('ai-input').focus();
}

function aiInputKeydown(e){
  if(e.key==='Enter' && !e.shiftKey){
    e.preventDefault();
    aiSend();
  }
}
function aiInputResize(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 80)+'px';
}

// Show notif dot when app loads (after login)
function showAiNotif(){
  if(!aiOpen) document.getElementById('ai-notif').style.display='block';
}
</script>
</body>
</html>
